tools:
  enabled:
    - searcher
    - deepfakedetector

deepfakedetector:
  deepfakebench_root: "third_party/deepfakebench/DeepfakeBench"
  weights_path: "third_party/deepfakebench/DeepfakeBench/training/weights/effort_clip_L14_trainOn_FFpp.pth"
  detector_config: "third_party/deepfakebench/DeepfakeBench/training/config/detector/effort.yaml"
  # Only if you run on face deepfakes & want automatic face crops:
  landmark_model: "third_party/deepfakebench/DeepfakeBench/preprocessing/shape_predictor_81_face_landmarks.dat"
  threshold: 0.5
  device: "cpu"
